name: Fix dashboard balance chart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Corrigir agrupamento diario do saldo acumulado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old = '''            daily = daily.groupby(daily["due_date"].dt.date, as_index=False)["signed"].sum()
            daily["acumulado"] = daily["signed"].cumsum()
            fig = px.area(daily, x="due_date", y="acumulado", markers=True)
'''

          new = '''            daily["date"] = daily["due_date"].dt.normalize()
            daily = daily.groupby("date", as_index=False, sort=True)["signed"].sum()
            daily["acumulado"] = daily["signed"].cumsum()
            fig = px.area(daily, x="date", y="acumulado", markers=True)
'''

          if old not in text:
              raise SystemExit('Trecho esperado não encontrado; patch não aplicado.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar sintaxe
        run: python -m py_compile app.py

      - name: Commit e push
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "fix: corrige saldo acumulado do dashboard"
          git push origin main
