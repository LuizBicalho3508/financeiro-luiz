name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar identidade visual global
        if: github.event_name == 'push'
        run: python tools/patch_global_ui_v4.py

      - name: Publicar ajuste se necessario
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- app.py dashboard_ui.py; then
            echo "Nenhuma alteracao necessaria."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py dashboard_ui.py
            git commit -m "feat: unifica identidade visual de todas as paginas"
            git push origin main
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app.py charts dashboard_ui.py
