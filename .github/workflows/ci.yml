name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar correcao do dashboard
        run: python tools/patch_dashboard_balance.py

      - name: Publicar correcao se necessario
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py ja esta corrigido."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "fix: corrige saldo acumulado do dashboard"
            git push origin main
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app.py
